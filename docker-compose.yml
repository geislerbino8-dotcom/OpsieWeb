version: "3.9"

services:

  certbot:
    image: certbot/certbot
    container_name: opsie-staging-certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_logs:/var/log/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew; done;'"

  mongodb:
    image: mongo:7
    container_name: opsie-staging-mongodb
    restart: always
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"

  backend:
    container_name: opsie-staging-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://mongodb:27017/opsie_staging_db

  frontend:
    container_name: opsie-staging-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:80"

volumes:
  mongodb_data: