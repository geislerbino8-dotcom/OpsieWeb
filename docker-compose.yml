version: "3.9"

services:

  certbot:
    image: certbot/certbot
    container_name: opsie-staging-certbot
    volumes:
      - opsiewebsite_certbot_data:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :;
      do sleep 12h & wait $${!};
      certbot renew;
      done;'

  backend:
    container_name: opsie-staging-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3000"
    env_file:
      - .env
    networks:
      - opsie-network

  frontend:
    container_name: opsie-staging-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "80"
    networks:
      - opsie-network

volumes:
  opsiewebsite_certbot_data:
    external: true

networks:
  opsie-network:
    external: true