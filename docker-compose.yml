version: "3.9"

services:

  certbot:
    image: certbot/certbot
    container_name: opsie-staging-certbot
    volumes:
      - certbot_data:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew; done;'"

  backend:
    container_name: opsie-staging-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env

  frontend:
    container_name: opsie-staging-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:80"

volumes:
  mongodb_data:
  certbot_data: