name: Deploy Staging

on:
  push:
    branches:
      - 1.0.2_staging_test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: Install frontend dependencies
      run: npm install
      working-directory: ./frontend

    - name: Build frontend
      run: npm run build
      working-directory: ./frontend

    - name: Install backend dependencies
      run: npm install
      working-directory: ./backend

    - name: Build backend
      run: npm run build
      working-directory: ./backend

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_KEY }}
        script: |
          TARGET_DIR="/var/www/staging.opsiesoftware"

          mkdir -p $TARGET_DIR

          rsync -avz --delete ./build/ $TARGET_DIR/
