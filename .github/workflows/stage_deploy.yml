name: CI / Deploy

on:
  push:
    branches:
      - 1.0.2
      - 1.1.0

  pull_request:
    branches:
      - 1.0.2
      - 1.1.0
      - 1.0.0

jobs:
  ci-check:
    name: Build Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build Backend
        working-directory: ./backend
        run: npm run build

  deploy-staging:
    name: Deploy Staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/1.0.2'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /apps/websites/opsie/staging/OpsieWebsite

            git config --global --add safe.directory /apps/websites/opsie/staging/OpsieWebsite

            git fetch origin
            git reset --hard origin/1.0.2

            docker compose pull
            docker compose up -d --build

            docker restart opsie-nginx

  deploy-live:
    name: Deploy Live
    if: github.event_name == 'push' && github.ref == 'refs/heads/1.1.0'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /apps/websites/opsie/live/OpsieWebsite

            git config --global --add safe.directory /apps/websites/opsie/live/OpsieWebsite

            git fetch origin
            git reset --hard origin/1.1.0

            docker compose pull
            docker compose up -d --build

            docker restart opsie-nginx