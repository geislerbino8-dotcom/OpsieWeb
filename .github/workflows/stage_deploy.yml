name: Deploy Staging

on:
  push:
    branches:
      - 1.0.2_staging_test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            # Navigate to staging directory
            cd /var/www/opsie-staging

            # Reset branch to match remote
            git fetch origin
            git reset --hard origin/1.0.2_staging_test

            # Rebuild and restart containers
            docker compose down
            docker compose up -d --build